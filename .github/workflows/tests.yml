# Runs the edit mode test suite on every push and pull request.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   UNITY_LICENSE  - contents of a Unity .ulf license file
#   UNITY_EMAIL    - Unity account e-mail
#   UNITY_PASSWORD - Unity account password
# See https://game.ci/docs/github/activation for how to obtain the license file.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  editmode-tests:
    name: EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json') }}
          restore-keys: Library-

      - name: Run edit mode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts
